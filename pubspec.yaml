name: symbolic_math_bridge
description: "A Flutter plugin providing a high-performance FFI bridge to the SymEngine symbolic math stack."
version: 1.0.15-android-scaffold
homepage:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Add the ffi package dependency
  ffi: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SwiftSymbolicMathBridgePlugin
        # This flag is essential for FFI plugins on iOS and macOS
        ffiPlugin: true
      macos:
        pluginClass: SwiftSymbolicMathBridgePlugin
        ffiPlugin: true
      # R132 scaffold (2026-05-27). The android/ directory carries the
      # Gradle module + CMakeLists + Kotlin plugin glue + force-link C
      # source, but the per-ABI prebuilt static archives
      # (libgmp.a / libmpfr.a / libmpc.a / libflint.a / libsymengine.a /
      # libsymengine_flutter_wrapper.a) are NOT yet shipped. CrispCalc
      # users on Android continue to fall through to the "bridge
      # unavailable" path until R132 completes (see ANDROID_STATUS.md).
      android:
        package: be.crispstro.symbolic_math_bridge
        pluginClass: SymbolicMathBridgePlugin
        ffiPlugin: true
