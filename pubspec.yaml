name: symbolic_math_bridge
description: "A Flutter plugin providing a high-performance FFI bridge to the SymEngine symbolic math stack."
version: 1.4.2
homepage:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.1
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SwiftSymbolicMathBridgePlugin
        # This flag is essential for FFI plugins on iOS and macOS
        ffiPlugin: true
      macos:
        pluginClass: SwiftSymbolicMathBridgePlugin
        ffiPlugin: true
      # R131 (2026-05-27): Windows MinGW64 build. libsymbolic_math_bridge_plugin.dll
      # shipped at windows/Libraries/, produced by build-windows.yml via
      # MSYS2/MinGW64 + source-built SymEngine 0.14.0 (cached). 5.7 MB stripped,
      # PE32+ x86_64, plain C ABI loadable from MSVC-built Flutter Windows apps.
      windows:
        pluginClass: SymbolicMathBridgePluginCApi
        ffiPlugin: true
      # R132 (2026-05-27): Android arm64-v8a build. libsymbolic_math_bridge.so
      # shipped at android/src/main/jniLibs/arm64-v8a/, produced by build-android.yml
      # via vcpkg + NDK cross-compile (VCPKG_CHAINLOAD_TOOLCHAIN_FILE pattern).
      # 17 MB stripped ELF, statically links SymEngine + FLINT + MPFR + MPC + GMP.
      # x86_64 + armeabi-v7a ABIs not yet built — extend the workflow matrix when
      # there's demand.
      android:
        package: be.crispstro.symbolic_math_bridge
        pluginClass: SymbolicMathBridgePlugin
        ffiPlugin: true
      # R130 (2026-05-29): Linux x86_64 build. libsymbolic_math_bridge.so
      # shipped at linux/Libraries/, produced by build-linux.yml via vcpkg's
      # x64-linux (static) triplet on ubuntu-22.04 (GLIBC 2.35 baseline).
      # Statically links SymEngine + FLINT + MPFR + MPC + GMP into one .so;
      # only dynamic deps are libc/libstdc++/libm/libgcc_s. Pure ffiPlugin —
      # no registrar class needed; Dart opens it by name.
      linux:
        ffiPlugin: true
