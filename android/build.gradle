// android/build.gradle
//
// Flutter plugin Gradle module for symbolic_math_bridge Android target.
// Consumer-side mode: jniLibs only. The per-ABI .so artifacts shipped
// at src/main/jniLibs/<abi>/ get packaged into the consumer APK
// automatically — no CMake / externalNativeBuild needed in the
// consumer build (consumer machines don't have SymEngine installed).
//
// Bridge maintainer / CI mode: build-android.yml in .github/workflows/
// invokes android/CMakeLists.txt directly (bypassing Gradle) to
// cross-compile the .so from source via vcpkg + NDK. That's where the
// SymEngine source build happens; the resulting .so lands in jniLibs/
// and gets committed.

group 'be.crispstro.symbolic_math_bridge'
version '1.1.1'

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'be.crispstro.symbolic_math_bridge'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs += 'src/main/jniLibs'
    }

    defaultConfig {
        minSdk 21
        ndk {
            // Three ABIs we target. armeabi-v7a is optional — included
            // here for older devices but the build script can drop it
            // to halve build time on CI when not needed.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // No externalNativeBuild — the consumer's Gradle invocation should
    // NOT try to compile the C wrapper from source (it'd need SymEngine
    // installed, which consumer machines don't have). The .so is
    // pre-built via build-android.yml and committed to jniLibs/. See
    // ANDROID_STATUS.md for the build path.

    // Don't try to strip — the wrapper symbols are dlsym-only and the
    // strip pass would drop them. Same logic as the iOS -all_load
    // workaround. (The .so we ship in jniLibs is already stripped
    // via NDK's llvm-strip; this directive guards against any future
    // re-strip pass Gradle might apply.)
    packagingOptions {
        doNotStrip '**/libsymbolic_math_bridge.so'
    }
}
