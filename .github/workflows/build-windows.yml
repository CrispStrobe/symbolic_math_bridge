name: Build Windows (vcpkg)

# R131 scaffold (2026-05-27). Produces a Windows DLL containing the
# `flutter_symengine_*` C wrapper statically linked against SymEngine
# (+ ARB, FLINT, MPFR, MPC, GMP via vcpkg).
#
# Strategy modeled on CrispASR's build.yml — `windows-latest` runner,
# vcpkg binary cache via the x-gha provider, single-shot MSVC build.
# vcpkg dependencies are declared via the manifest at windows/vcpkg.json
# rather than imperative `vcpkg install` calls so the workflow is
# reproducible across runner image bumps.

on:
  push:
    branches:
      - 'r131-*'
      - 'main'
    paths:
      - '.github/workflows/build-windows.yml'
      - 'windows/**'
      - 'src/**'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # for the x-gha vcpkg binary cache

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
        # arm64 (Surface Pro X / Copilot+ PCs) would use the
        # `arm64-windows-static` triplet — defer until there's demand.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GHA cache env (for vcpkg x-gha)
        # vcpkg's x-gha binary cache needs these two env vars. They're
        # set by the runner but only as job-step env, not as process
        # env — re-exporting via core makes them visible to vcpkg.
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Use bundled vcpkg
        # The windows-latest image ships with a recent vcpkg at
        # C:\vcpkg. We don't pin to a specific commit here — the
        # manifest at windows/vcpkg.json declares the desired symengine
        # version range and vcpkg's own builtin-baseline resolves it.
        # If/when reproducibility issues surface, add a builtin-baseline
        # field to windows/vcpkg.json.
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            Write-Error "vcpkg not found at C:\vcpkg — runner image may have changed."
            exit 1
          }
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install SymEngine + deps via vcpkg manifest
        # Manifest install: reads windows/vcpkg.json, resolves the
        # symengine port + transitive deps (boost-math, boost-random,
        # mpir/gmp, mpfr, flint, arb) for the chosen triplet. First
        # run takes ~30 min; subsequent runs hit the x-gha cache.
        shell: pwsh
        working-directory: windows
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet x64-windows-static `
            --x-manifest-root="$PWD" `
            --binarysource="clear;x-gha,readwrite"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure (CMake, standalone)
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -S windows -B build `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DFLUTTER_PLUGIN_STANDALONE=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4

      - name: Inspect output
        shell: pwsh
        run: |
          Write-Host "--- build/ tree (interesting binaries) ---"
          Get-ChildItem -Recurse build -Include *.dll,*.lib,*.exe -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          $dll = Get-ChildItem -Recurse build -Filter "symbolic_math_bridge_plugin.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) {
            Write-Host ""
            Write-Host "--- exported symbols (flutter_symengine_*) ---"
            & dumpbin /EXPORTS $dll.FullName | Select-String "flutter_symengine_"
          } else {
            Write-Warning "No symbolic_math_bridge_plugin.dll produced."
          }

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: symbolic_math_bridge_plugin-windows-${{ matrix.arch }}
          path: |
            build/**/symbolic_math_bridge_plugin.dll
            build/**/symbolic_math_bridge_plugin.lib
          if-no-files-found: warn
